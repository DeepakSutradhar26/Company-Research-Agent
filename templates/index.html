<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lead Intake Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #111827;
            padding: 30px;
            border-radius: 12px;
            width: 420px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
        }

        input {
            background: #1f2937;
            color: white;
        }

        button {
            background: #3b82f6;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #2563eb;
        }

        .note {
            font-size: 12px;
            text-align: center;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Lead Submission</h2>

    <form id="leadForm">
        <input type="text" id="name" placeholder="Full Name" required>

        <input type="email" id="email" placeholder="Email Address" required>

        <input type="text" id="company" placeholder="Company Name" required>

        <input type="url" id="website" placeholder="Company Website (https://...)">

        <button type="submit">Submit</button>
    </form>

    <p class="note">Your data will be analyzed and a report will be sent to your email.</p>
</div>

<script>
document.getElementById("leadForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        company: document.getElementById("company").value,
        url: document.getElementById("website").value
    };

    try {
        const response = await fetch("http://localhost:8000/submit-lead", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();
        alert(result.message || "Lead submitted successfully!");
    } catch (error) {
        alert("Submission failed. Please try again.");
        console.error(error);
    }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lead Intake Form</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #111827;
            padding: 30px;
            border-radius: 12px;
            width: 420px;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }

        input {
            background: #1f2937;
            color: white;
        }

        input::placeholder {
            color: #6b7280;
        }

        button {
            background: #3b82f6;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 42px;
        }

        button:hover:not(:disabled) {
            background: #2563eb;
        }

        button:disabled {
            background: #1e3a6e;
            cursor: not-allowed;
            opacity: 0.8;
        }

        .note {
            font-size: 12px;
            text-align: center;
            opacity: 0.7;
            margin-top: 10px;
        }

        /* Spinner */
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Status message */
        .status {
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            min-height: 18px;
            color: #93c5fd;
            display: none;
        }

        /* Success message */
        .success-box {
            display: none;
            background: #052e16;
            border: 1px solid #16a34a;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            margin-top: 12px;
            color: #4ade80;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Lead Submission</h2>

    <form id="leadForm">
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="text" id="company" placeholder="Company Name" required>
        <input type="url" id="website" placeholder="Company Website (https://...)">

        <button type="submit" id="submitBtn">
            <div class="spinner" id="spinner"></div>
            <span id="btnText">Submit</span>
        </button>
    </form>

    <div class="status" id="statusMsg">
        Analyzing company data and generating your report...
    </div>

    <div class="success-box" id="successBox"></div>

    <p class="note">Your data will be analyzed and a report will be sent to your email.</p>
</div>

<script>
    const form       = document.getElementById("leadForm");
    const btn        = document.getElementById("submitBtn");
    const spinner    = document.getElementById("spinner");
    const btnText    = document.getElementById("btnText");
    const statusMsg  = document.getElementById("statusMsg");
    const successBox = document.getElementById("successBox");

    const steps = [
        "Scraping company website...",
        "Fetching public data...",
        "Running AI analysis...",
        "Generating PDF report...",
        "Sending email...",
    ];

    let stepIndex = 0;
    let stepInterval = null;

    function startLoading() {
        btn.disabled = true;
        spinner.style.display = "block";
        btnText.textContent = "Processing...";
        statusMsg.style.display = "block";
        statusMsg.textContent = steps[0];
        stepIndex = 1;

        stepInterval = setInterval(() => {
            if (stepIndex < steps.length) {
                statusMsg.textContent = steps[stepIndex];
                stepIndex++;
            }
        }, 25000); // cycle every 25 seconds
    }

    function stopLoading() {
        btn.disabled = false;
        spinner.style.display = "none";
        btnText.textContent = "Submit";
        statusMsg.style.display = "none";
        clearInterval(stepInterval);
    }

    form.addEventListener("submit", async function(e) {
        e.preventDefault();
        successBox.style.display = "none";

        const data = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            company: document.getElementById("company").value,
            url: document.getElementById("website").value
        };

        startLoading();

        try {
            const response = await fetch("https://company-research-agent-production-e45b.up.railway.app/submit-lead", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (response.ok) {
                successBox.style.display = "block";
                successBox.textContent = result.message || "Report sent successfully! Check your email.";
                form.reset();
            } else {
                alert("Error: " + (result.detail || "Something went wrong."));
            }

        } catch (error) {
            alert("Submission failed. Please try again.");
            console.error(error);
        } finally {
            stopLoading();
        }
    });
</script>

</body>
</html>
